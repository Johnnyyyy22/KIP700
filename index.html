<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b5fff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KIP 700 Install Guide</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14181f;--mut:#5b6573;--line:#e1e5ea;--acc:#0b5fff;--accbg:#e8f0ff;--ok:#1a7f4b;--okbg:#e6f6ec;--warn:#b42318;--warnbg:#fdecea;--note:#7a5b00;--notebg:#fff6dc}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181d24;--ink:#e8ecf1;--mut:#9aa5b3;--line:#2a323c;--acc:#6ea0ff;--accbg:#18233a;--ok:#5fd093;--okbg:#12281d;--warn:#ff8a80;--warnbg:#321a19;--note:#f3cf6a;--notebg:#2b2410}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
header h1{font-size:17px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
header small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.bar{height:8px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.sec{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer;min-height:60px}
.sec .ic{font-size:22px;width:34px;text-align:center}
.sec .tt{flex:1}.sec .tt b{display:block;font-size:15px}.sec .tt span{font-size:12px;color:var(--mut)}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.pill.done{background:var(--okbg);color:var(--ok)}
.tag{font-size:11px;background:var(--notebg);color:var(--note);padding:2px 7px;border-radius:6px;margin-left:6px}
button{font:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 14px;min-height:44px;cursor:pointer}
.btn.ghost{background:var(--accbg);color:var(--acc)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:14px}
.step{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step .cb{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--mut);background:transparent;color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:0;margin-top:1px}
.step.done .cb{background:var(--ok);border-color:var(--ok)}
.step.done .tx{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line)}
.step .num{color:var(--mut);font-size:12px;margin-right:4px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.fields label{font-size:11px;color:var(--mut);display:block}
.fields input,.txt input,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.ph{font-size:11px;color:var(--warn)}
.callout{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.callout.w{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.callout.n{background:var(--notebg);color:var(--note)}
.callout b{display:block;font-size:11px;letter-spacing:.06em;margin-bottom:2px}
h3.sub{margin:16px 2px 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--accbg);color:var(--acc)}
.cap{font-size:12px;color:var(--mut);margin:-4px 0 8px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;min-height:56px;font-size:12px;cursor:pointer}
nav.tabs button.on{color:var(--acc);font-weight:600}
nav.tabs button span{display:block;font-size:20px}
.timer{display:inline-flex;gap:8px;align-items:center;margin-top:8px}
.timer b{font-variant-numeric:tabular-nums;font-size:18px}
.back{background:none;border:0;color:var(--acc);padding:6px 0;cursor:pointer;font-size:15px}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
pre{white-space:pre-wrap;font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.hit{background:var(--notebg)}
.fbtn{margin-top:8px}
.fimg{display:block;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.fl{font-size:12px;border:0;background:none;color:var(--acc);padding:4px 0;cursor:pointer;display:block}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:none;flex-direction:column}
#lb.on{display:flex}
#lb .tb{display:flex;gap:6px;align-items:center;padding:8px;padding-top:max(8px,env(safe-area-inset-top));color:#fff;flex-wrap:wrap}
#lb .tb button{background:#2d3440;color:#fff;border:0;border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
#lb .tb span{flex:1;text-align:center;font-size:13px;min-width:90px}
#lbs{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#lbs img{display:block;background:#fff;margin:0 auto}
.dl{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.dl i{display:block;height:100%;width:0;background:var(--acc)}
</style>
</head>

<header>
  <h1><span>KIP 700 Series Install Guide <small>KIP 730/740 · Guides 1-4 · Ver. A.4</small></span><span class="pill" id="pct">0%</span></h1>

</header>
<main id="app"></main>

const SECTIONS = [

  S('High-accuracy water level, sensitivity 0.02 mm/1 m, plus the Level Jig (kit "LEVEL JIG KIT" Z488580040).'),

  S('Base plates (as needed): put under the height adjusters if the floor is soft carpet.'),

  S('MFP only: remove 2 screws (M4x6) to remove the (second) Top Cover.', { mfp: 1 }),
  S('Remove 2 screws (M4x8) and LOOSEN 1 screw to remove Side Cover L. Pull the cover forward to remove it.'),

{ id: 'level', g: 'G1', pg: 'p.18-26', title: '4. Levelling the printer', icon: '📐', items: [

  S('Prepare the level (0.02 mm/1 m). Use the "LEVEL JIG KIT" (Z488580040) every time you level this machine.'),

  S('Turn the Adjustment Bolts on the 4 bottom corners by hand until they touch the floor.'),
  W('Level reading is position- and orientation-sensitive. Always put the level at the same spot with the SAME orientation. Once placed in a direction at a measuring location, never change it for later measurements. On the rear base plate, draw marking lines the first time and always return to exactly that spot and direction.'),
  W('Make sure the Jig is firmly fitted into the positioning holes and the level base touches the Jig with no gap.'),
  H('Stage 1 (coarse): target ±3 scales (0.06 mm/1 m)'),
  S('Level at "A" (right side bracket): level right-front vs right-rear using Adjuster Bolts 1 and 2. Requirement ±3 scales.', { f: ['Reading A (scales)'] }),
  S('Level at "B" (left side bracket): level left-front vs left-rear using Adjuster Bolts 3 and 4. Requirement ±3 scales.', { f: ['Reading B (scales)'] }),
  S('Level at "C" (base plate, rear): level left vs right using Adjuster Bolts 1, 2, 3, 4. Requirement ±3 scales.', { f: ['Reading C (scales)'] }),
  W('When raising/lowering one SIDE, turn BOTH bolts on that side by the same amount (e.g. left side: bolts 3 and 4 together). Turning only one twists the frame.'),
  N('Do not raise the machine yet; that is the next block.'),
  H('Raise the machine about 5 mm'),
  S('Turn Adjuster Bolt 1 by 180° (raises right-front).'),
  S('Turn Adjuster Bolt 2 by 180° (raises right-rear).'),
  S('Turn Adjuster Bolt 3 by 180° (raises left-front).'),
  S('Turn Adjuster Bolt 4 by 180° (raises left-rear).'),
  S('Repeat the 4 turns several times, raising all corners evenly, little by little, until there is about 5 mm between the caster bottoms and the floor.'),
  W('Raise all 4 corners EVENLY. A twisted/distorted frame badly affects image quality.'),
  H('Stage 2 (fine)'),
  S('Check "A": must be within ±1 scale (±0.02 mm).', { f: ['A (±1)'] }),
  S('Check "B": must be within ±1 scale (±0.02 mm).', { f: ['B (±1)'] }),
  S('Check "C": must be within ±3 scales (±0.06 mm).', { f: ['C (±3)'] }),

  S('Remove the red screws on both sides (shipping only). DISPOSE of them.'),
  S('Grab the metal parts and take out the whole LED Head Assy.'),
  W('LED Head is installed at an angle. Lift gently WHILE KEEPING the angle and only later turn it level. If you level it from the start it will not come out of the bracket.'),
  W('Harness Guide on the Process Block drive side blocks the pin of the LED Head. At the last stage: (1) first remove the pin on the Toner Hopper side from its LED Head Guide (assy tilts); (2) holding it slanted, shift toward the Toner Hopper side and remove the pin on the drive side.'),
  H('Remove Charging Roller'),
  S('Open the Wire Saddle and unplug the HV cable from the Charge Roller Assembly. LOOSEN the 2 screws on both sides (captive).'),
  S('Hold the metal sections on both sides. Detach the Charging Roller Assy: (1) move it toward location (A) along the Arc on the Process Block; (2) gently lift it, keeping the angle, until it clears the drum surface; (3) turn it level and take it out. Remove the protection paper.'),
  H('Prepare cleaner'),
  S('Remove the protection sheets on all Drum Cleaner Units. Slide and lift out the 8 Pad Assys. They are not used any more: DISCARD.'),
  S('Apply ENOUGH toner to (a) the edge of the Cleaner Blade that touches the drum and (b) the step below the Cleaner Blade (brush).'),
  W('Too little toner = high friction, blade can flip over and damage the Drum or blade. Take toner from the toner bottle of the SAME color as the process (toner color = process color).'),
  H('Install Drum (repeat per color)'),
  S('Toner-supply side (printer LEFT): remove 4 screws (M4x8) to remove the Drum Bracket.'),
  S('Fit the Drum Guide Jig onto the Right Process Block on the right side (used only for drum install/removal).'),
  S('Open the Drum box. One shaft has "fins" and a marking. Hold both flanges with the marking upright and take the drum out.'),
  W('The shaft WITH fins and marking goes on the DRIVE side (right). Which hand holds the fin side depends on color: Process K and C = RIGHT hand; Process M and Y = LEFT hand.'),
  S('Put both shafts in the guide grooves on both sides, lower the drum until both shafts reach the bottom.'),
  W('Fin shaft (fins every 45°) must be on the Drive side. Shaft without fin on the Toner Supply side.'),
  S('Remove the Drum Guide Jig from the Right Process Block.'),
  S('Rotate the Drum 90° TOWARD THE REAR of the printer so the marking points to the rear (away from the Drum Cleaner).'),
  W('ALWAYS rotate the drum toward the REAR (top of drum goes away from the Drum Cleaner). NEVER toward the front: the gray brush and soft sheet in the cleaner get caught and deformed, toner spills and parts must be replaced.'),
  S('With a soft cloth that cannot damage the drum, put toner (same color as process) on the entire upper face of the drum.'),
  S('Rotate the Drum toward the rear until the marking reappears (about 225°).'),
  S('Align the positioning block (marking side of the drive-side shaft) with the marked cut-out of the drum shaft.'),
  N('To adjust angle, keep rotating toward the rear. If you pass the engagement point, rotate one full revolution toward the rear. Never rotate toward the front.'),
  S('Fix the Drum Bracket (toner supply side) with 4 screws (M4x8). Orientation of the bracket does not matter.'),
  W('Tighten the 4 screws evenly, little by little. Never fully tighten one first.'),
  S('Holding the metal edge parts on both sides, rotate the drum toward the rear. This brings toner to the drum/cleaner-blade contact point.'),
  N('You will feel some heaviness now: the drum is coupled to the drive.'),
  S('Repeat "put toner on the drum" + "rotate toward rear" 3 MORE times to fully supply toner to the Cleaner Blade.'),
  W('Check the drum surface on both sides: there must be NO "toner ring". If a toner ring appears inside the blade, detach the drum and check the blade edge: no space between blade edge and the felt side seal; felt must not push the blade inward. If pushed in, move the blade back with a flat/minus screwdriver. Do not damage or deform the copper reinforcement plate.'),
  H('Reassemble (same color order)'),
  S('Remove excess toner dirt from the drum surface. Return the Charging Roller Assy to its original position. It has 4 pins (A, B, C, D): insert them in their slits (guide rails), lower fully, then slide along the guide to the bottom end.'),
  S('Fix the Charging Roller Assy with 2 screws: DRIVE side (right) FIRST, then the toner-supply side (left).'),
  S('Plug the HV cable into the LED Resister PCB Assy and secure it with the Wire Saddle.'),
  S('Hold the metal parts and return the LED Head Assy to its original position. Pins E and F on both sides must enter the slits of the Process Block.'),
  W('Confirm both pins on BOTH sides are in the slits before shifting it down. Forcing it with only 1 pin in the slit can damage the Process Block.'),
  W('Insert pin F into the LED Head Guide on the DRIVING side first, then pin E into the Toner Hopper side. Lower it level then turn to the install angle (reverse of removal).'),
  W('After mounting, the positioning pins on both sides must fit the long holes of the LED Head Assy (OK/NG figure).'),
  S('Return both Holder Brackets to original positions, tighten the screws, making sure the positioning bosses fit the positioning holes.'),
  S('Plug the DC harness connector into the LED Head Terminal PCB and fit the harness in the holders.'),
  S('Plug the ribbon cable connector into the LED Head Terminal PCB and fit it in the holders correctly.'),
  W('Route the ribbon cable so it does NOT touch the neighboring Developer Assy.'),
  S('Return the Developer Assy to its original position. Insert the Main Shaft ends (G, H) into the slits, then lower the developer to the bottom end. Verify it is seated before letting go.'),
  W('Never press the Developer bottom plate. Keep away from the LED Head Focus Motors. Keep the incline while lowering so both shaft ends follow the rails.'),
  S('After remounting, move the Developer Assy left and right so it seats in position.'),
  S('Return both fixing plates and fix with their screws.'),
  S('Connect the HV cable to the corresponding developer.'),
  S('Plug the DC cables into the LED Head Terminal PCB.'),
  S('Push the harnesses of the Toner Hopper Motor into the machine.'),
  H('Toner Hopper'),
  S('Fit the hook on the Toner Hopper into the rectangular opening on the machine side frame, while inserting the toner supply duct into the receptacle on the Developer Unit.'),
  S('Fix the Toner Hopper with 2 screws (M4x10).'),
  S('Fix the Fook with 2 screws (M4x6).'),
  W('The hook part must fit the groove of the screw shaft, and the round-hole part must also fit the groove of the screw shaft.'),
  S('Connect the Hopper Motor connector.'),
  H('Transfer belt'),
  S('LOOSEN 3 screws and REMOVE 4 screws (M4x6) to remove the Cover. Support the cover while removing the 4 screws so it does not fall.'),
  S('Lay a large sheet in front of the machine. Gently pull and wind the BLACK protection sheet on the Transfer Belt so toner powder on it does not spill into the machine.'),
  N('Tip: tick this section color by color in your notes (K / C / M / Y) so nothing is skipped.'),
]},

const KEY='kip700_v1';
let st={model:'mfp',info:{site:'',serial:'',tech:'',date:''},done:{},vals:{},notes:''};
try{const r=localStorage.getItem(KEY);if(r)st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const $=s=>document.querySelector(s);
const app=$('#app');
let tab='guide',cur=null,q='';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isMfp=()=>st.model==='mfp';
const vis=sec=>isMfp()||!sec.mfp;
const stepsOf=sec=>sec.items.map((it,i)=>({it,i})).filter(x=>x.it.k==='s'&&(isMfp()||!x.it.mfp));
const key=(sid,i)=>sid+':'+i;
function prog(sec){const ss=stepsOf(sec);const d=ss.filter(x=>st.done[key(sec.id,x.i)]).length;return{d,t:ss.length};}
function total(){let d=0,t=0;SECTIONS.filter(vis).forEach(s=>{const p=prog(s);d+=p.d;t+=p.t});return{d,t};}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600);}
function updHead(){const{d,t}=total();const p=t?Math.round(d*100/t):0;$('#pct').textContent=p+'%';$('#barfill').style.width=p+'%';}

const OFF={1:1,2:1,3:2,4:2},NP={1:40,2:68,3:88,4:32};
const imgSrc=(g,p)=>`img/g${g}-${String(p).padStart(2,'0')}.jpg`;
const openFig={};
function pageFor(sid,i){const m=PM[sid]||{};if(m[i])return m[i];const sec=SECTIONS.find(s=>s.id===sid);
  for(let j=i-1;j>=0;j--)if(m[j])return m[j];for(let j=i+1;j<sec.items.length;j++)if(m[j])return m[j];return null;}
const lab=pg=>`G${pg[0]} p.${pg[1]-OFF[pg[0]]}`;
function figHtml(sid,i){const pg=pageFor(sid,i);if(!pg)return'';const k=sid+':'+i;const o=openFig[k];
  return `<button class="btn ghost sm fbtn" data-fig="${k}">📷 ${o?'Hide':'Show'} figure · ${lab(pg)}</button>${o?`<img class="fimg" loading="lazy" src="${imgSrc(pg[0],pg[1])}" data-lb="${pg[0]}:${pg[1]}" alt="Manual figure ${lab(pg)}">`:''}`;}
function renderItem(sec,x){
  const it=x.it,i=x.i;
  if(it.k==='h')return `<h3 class="sub">${esc(it.t)}</h3>`;
  if(it.k==='w')return `<div class="callout w"><b>⚠ WARNING / CAUTION</b>${esc(it.t)}${figHtml(sec.id,i)}</div>`;
  if(it.k==='n')return `<div class="callout n"><b>ℹ NOTE</b>${esc(it.t)}${figHtml(sec.id,i)}</div>`;
  if(it.k==='tbl'){return `<table><tr>${it.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${it.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>${it.cap?`<div class="cap">${esc(it.cap)}</div>`:''}`;}
  if(it.mfp&&!isMfp())return'';
  const k=key(sec.id,i),dn=!!st.done[k];
  let h=`<div class="step ${dn?'done':''}" data-k="${k}"><button class="cb" data-cb="${k}" aria-label="done">${dn?'✓':''}</button><div style="flex:1"><div class="tx">${it.mfp?'<span class="tag">MFP only</span> ':''}${esc(it.t)}</div>`;
  if(it.ref)h+=`<div class="cap">${esc(it.ref)}</div>`;
  if(it.f){h+=`<div class="fields">`+it.f.map((l,j)=>`<div><label>${esc(l)} <span class="ph">← enter yours</span></label><input data-v="${k}:${j}" value="${esc(st.vals[k+':'+j]||'')}" inputmode="text" autocomplete="off"></div>`).join('')+`</div>`;}
  h+=figHtml(sec.id,i);
  if(it.timer)h+=`<div class="timer"><button class="btn ghost sm" data-timer="${it.timer}">⏱ Start ${it.timer}-min timer</button><b></b></div>`;
  return h+`</div></div>`;
}

function renderGuide(){
  if(cur){
    const sec=SECTIONS.find(s=>s.id===cur);const p=prog(sec);
    const vi=SECTIONS.filter(vis);const idx=vi.findIndex(s=>s.id===cur);
    let h=`<button class="back" id="bk">‹ All sections</button><div class="card"><div class="row"><span style="font-size:26px">${sec.icon}</span><div style="flex:1"><b>${esc(sec.title)}</b><div class="cap" style="margin:0">${sec.g} ${sec.pg} · ${p.d}/${p.t} steps</div></div></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="all">Tick all</button><button class="btn ghost sm" id="none">Clear</button></div></div><div class="card">`;
    sec.items.forEach((it,i)=>{h+=renderItem(sec,{it,i});});
    h+=`</div><div class="row">`;
    if(idx>0)h+=`<button class="btn ghost" style="flex:1" data-go="${vi[idx-1].id}">‹ Previous</button>`;
    if(idx<vi.length-1)h+=`<button class="btn" style="flex:1" data-go="${vi[idx+1].id}">Next ›</button>`;
    return h+`</div>`;
  }
  let h=`<div class="card"><b>Job setup</b><div class="cap">Choose your model. MFP-only steps are hidden for the Printer model.</div>
  <div class="seg"><button data-m="mfp" class="${isMfp()?'on':''}">MFP (with scanner)</button><button data-m="prn" class="${isMfp()?'':'on'}">Printer only</button></div>
  <div class="fields">
    <div><label>Site / branch <span class="ph">← replace</span></label><input data-i="site" value="${esc(st.info.site)}"></div>
    <div><label>Serial no. <span class="ph">← replace</span></label><input data-i="serial" value="${esc(st.info.serial)}"></div>
    <div><label>Technician <span class="ph">← replace</span></label><input data-i="tech" value="${esc(st.info.tech)}"></div>
    <div><label>Date <span class="ph">← replace</span></label><input data-i="date" value="${esc(st.info.date)}"></div></div></div>
  <div class="card txt"><input id="srch" placeholder="🔍 Search all steps (e.g. drum, BUD 1612, level)" value="${esc(q)}"></div>`;
  if(q){
    const ql=q.toLowerCase();let c=0;
    SECTIONS.filter(vis).forEach(sec=>{sec.items.forEach((it,i)=>{
      const txt=(it.t||'')+' '+(it.rows?it.rows.flat().join(' '):'')+' '+(it.head?it.head.join(' '):'');
      if(txt.toLowerCase().includes(ql)&&c<40){c++;h+=`<button class="sec" data-go="${sec.id}"><div class="tt"><b>${esc((it.t||(it.rows?'Table: '+it.rows[0].join(' · '):'')).slice(0,140))}</b><span>${esc(sec.title)} · ${sec.g} ${sec.pg}</span></div></button>`;}
    });});
    if(!c)h+=`<div class="card cap">No match.</div>`;
    return h;
  }
  SECTIONS.filter(vis).forEach(sec=>{const p=prog(sec);const dn=p.t&&p.d===p.t;
    h+=`<button class="sec" data-go="${sec.id}"><div class="ic">${sec.icon}</div><div class="tt"><b>${esc(sec.title)}${sec.mfp?'<span class="tag">MFP</span>':''}</b><span>${sec.g} ${sec.pg}</span></div><span class="pill ${dn?'done':''}">${dn?'✓ done':p.d+'/'+p.t}</span></button>`;});
  return h;
}

function renderRef(){
  let h=`<div class="card"><b>Use without internet</b><div class="cap">Open this app once with signal, tap the button, and all 228 manual pages (~17 MB) are saved on this phone.</div><div class="dl"><i id="dlbar"></i></div><button class="btn" id="dlall">Save all figures for offline</button></div><div class="card"><b>Quick reference</b>${QUICK.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b style="font-size:14px">${esc(r[0])}</b><div style="font-size:14px;color:var(--mut)">${esc(r[1])}</div></div>`).join('')}</div>`;
  h+=`<div class="card"><b>Backup Data (BUD) standard values</b><table><tr><th>BUD</th><th>Item</th><th>Value</th></tr>${BUDREF.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table><div class="cap">Always: change value → [OK] (blue) → [Send] (black) → power cycle when the guide says so.</div></div>`;
  h+=`<div class="card"><b>Before you leave the site</b>`+['Level re-checked (A & B ±1, C ±3)','All covers back on, no spare screws','Roll deck closed and locked','Region code NOT 00, power cycled','All 4 colors toner installed','Density Adjustment (0720) and Auto Density (1785) = 1','MFP: BUD 15 restored, BUD backup CSV saved','Customer told: re-check level later (floor settles)'].map(x=>`<div class="step"><div style="flex:1">${esc(x)}</div></div>`).join('')+`</div>`;
  return h;
}

function report(){
  let o=`KIP 700 INSTALL REPORT\nSite: ${st.info.site||'—'}\nSerial: ${st.info.serial||'—'}\nTechnician: ${st.info.tech||'—'}\nDate: ${st.info.date||'—'}\nModel: ${isMfp()?'MFP':'Printer'}\n\n`;
  SECTIONS.filter(vis).forEach(sec=>{const p=prog(sec);o+=`[${p.d===p.t?'x':' '}] ${sec.title} (${p.d}/${p.t})\n`;
    sec.items.forEach((it,i)=>{if(it.f)it.f.forEach((l,j)=>{const v=st.vals[key(sec.id,i)+':'+j];if(v)o+=`     ${l}: ${v}\n`;});});});
  if(st.notes)o+=`\nNotes:\n${st.notes}\n`;return o;
}
function renderLog(){
  const{d,t}=total();
  let h=`<div class="card"><b>Progress: ${d}/${t} steps</b><div class="cap">Readings you typed into step fields are collected below.</div></div><div class="card"><b>Notes / issues</b><textarea id="notes" rows="5" placeholder="Anything unusual, parts missing, customer requests…">${esc(st.notes)}</textarea></div>
  <div class="card"><b>Report</b><pre id="rep">${esc(report())}</pre><div class="row"><button class="btn" id="cp">Copy report</button><button class="btn ghost" id="rs">Reset everything</button></div><div id="rsc"></div></div>`;
  return h;
}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  app.innerHTML=tab==='guide'?renderGuide():tab==='ref'?renderRef():renderLog();
  updHead();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab!=='guide')cur=null;render();window.scrollTo(0,0);});

app.addEventListener('click',e=>{
  const im=e.target.closest('img[data-lb]');if(im){const[g,p]=im.dataset.lb.split(':');openLb(+g,+p);return;}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.fig){openFig[t.dataset.fig]=!openFig[t.dataset.fig];const sc=window.scrollY;render();window.scrollTo(0,sc);return;}
  if(t.id==='dlall'){dlAll(t);return;}
  if(t.dataset.cb){const k=t.dataset.cb;st.done[k]=!st.done[k];save();const row=t.closest('.step');row.classList.toggle('done',!!st.done[k]);t.textContent=st.done[k]?'✓':'';updHead();
    const sec=SECTIONS.find(s=>s.id===cur);const p=prog(sec);document.querySelector('.cap').textContent=`${sec.g} ${sec.pg} · ${p.d}/${p.t} steps`;return;}
  if(t.dataset.go){cur=t.dataset.go;q='';render();window.scrollTo(0,0);return;}
  if(t.id==='bk'){cur=null;render();return;}
  if(t.dataset.m){st.model=t.dataset.m;save();render();return;}
  if(t.id==='all'||t.id==='none'){const sec=SECTIONS.find(s=>s.id===cur);stepsOf(sec).forEach(x=>{st.done[key(sec.id,x.i)]=t.id==='all';});save();render();return;}
  if(t.dataset.timer){const b=t.parentElement.querySelector('b');let s=+t.dataset.timer*60;t.disabled=true;
    const iv=setInterval(()=>{s--;b.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s<=0){clearInterval(iv);b.textContent='Time is up ✓';t.disabled=false;toast('Timer finished');try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}},1000);return;}
  if(t.id==='cp'){const txt=report();try{navigator.clipboard.writeText(txt).then(()=>toast('Report copied'),()=>toast('Copy blocked: select the text manually'));}catch(e){toast('Copy blocked: select the text manually');}return;}
  if(t.id==='rs'){$('#rsc').innerHTML=`<div class="callout w" style="margin-top:10px"><b>RESET</b>This clears all ticks, readings and notes on this device.<div class="row" style="margin-top:8px"><button class="btn sm" id="rs2" style="background:var(--warn)">Yes, reset</button></div></div>`;return;}
  if(t.id==='rs2'){st={model:st.model,info:{site:'',serial:'',tech:'',date:''},done:{},vals:{},notes:''};save();render();toast('Reset');return;}
});
app.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.v){st.vals[el.dataset.v]=el.value;save();}
  else if(el.dataset.i){st.info[el.dataset.i]=el.value;save();}
  else if(el.id==='notes'){st.notes=el.value;save();}
  else if(el.id==='srch'){q=el.value.trim();const pos=el.selectionStart;render();const n=$('#srch');n.focus();n.setSelectionRange(pos,pos);}
});
let LB={g:1,p:1,z:1};
function lbShow(){const i=$('#lbi');i.src=imgSrc(LB.g,LB.p);i.style.width=(LB.z*100)+'%';$('#lbt').textContent=`G${LB.g} p.${LB.p-OFF[LB.g]} (file ${LB.p}/${NP[LB.g]})`;}
function openLb(g,p){LB={g,p,z:1};$('#lb').classList.add('on');lbShow();$('#lbs').scrollTo(0,0);}
$('#lbx').onclick=()=>$('#lb').classList.remove('on');
$('#lbp').onclick=()=>{if(LB.p>1){LB.p--;lbShow();$('#lbs').scrollTo(0,0);}};
$('#lbn').onclick=()=>{if(LB.p<NP[LB.g]){LB.p++;lbShow();$('#lbs').scrollTo(0,0);}};
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{LB.z=+b.dataset.z;lbShow();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on');});
async function dlAll(btn){
  if(!('caches' in window)){toast('Offline cache not supported in this browser');return;}
  btn.disabled=true;const c=await caches.open('kip700-img');let n=0,tot=0;const list=[];
  for(const g of [1,2,3,4])for(let p=1;p<=NP[g];p++){list.push(imgSrc(g,p));}tot=list.length;
  const bar=$('#dlbar');
  for(const u of list){try{if(!(await c.match(u))){const r=await fetch(u);if(r.ok)await c.put(u,r);}}catch(e){}n++;bar.style.width=(n*100/tot)+'%';btn.textContent=`Downloading ${n}/${tot}…`;}
  btn.textContent='✓ All figures saved for offline use';toast('Offline ready');
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
render();
</script>
</body>
</html>
